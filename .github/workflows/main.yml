name: CI/CD Workflow - Shelf

on:
  push:
    branches:
      - main
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, fileinfo, gd, mbstring, pdo_sqlite, zip
        coverage: none

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Audit production PHP dependencies
      run: composer audit --no-dev --abandoned=report

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Audit Node dependencies
      run: npm audit --audit-level=moderate

    - name: Build frontend assets
      run: npm run build

    - name: Prepare test application
      run: |
        cp .env.example .env
        php artisan key:generate --ansi
        touch database/database.sqlite

    - name: Run database migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Check PHP formatting
      run: vendor/bin/pint --test

    - name: Run tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            cd ~/cs_shelf
          else
            cd ~/AppDev/www/staging/web-shelf
          fi
          
          git pull origin ${{ github.ref_name }}
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan migrate --force
          php artisan shield:generate --all
          
          php artisan cache:clear
          php artisan config:cache
          php artisan route:cache
          php artisan optimize
          
          echo ${{ secrets.VPS_PASSWORD }} | sudo -S systemctl restart nginx
